# The image's single-node config ...
coordinator=true
node-scheduler.include-coordinator=true
discovery.uri=http://localhost:8080
catalog.management=${ENV:CATALOG_MANAGEMENT}
cache-manager.config-files=etc/cache-manager-memory.properties
# ... plus: forget finished queries and their tasks quickly. By default each is
# kept, with its text and plan, for at least 15 minutes. A test run is some 600
# queries and 20 MB of INSERT text, so a few runs in a row would fill the heap.
query.max-history=20
query.min-expire-age=30s
task.info.max-age=30s
