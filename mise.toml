[tools]
watchexec = "latest"
uv = "latest"

[env]
_.file = { path = ".env", redact = false }
IBIS_TESTING_DATA = "{{config_root}}/ci/ibis-testing-data"
IBIS_TESTING_POSTGRES_URL = "host={{config_root}}/.pg port=54330 user=postgres dbname=ibis_testing"

[tasks.setup]
description = "Download Ibis testing data; generate TPC-H sf=0.01 into DuckDB/SQLite/Postgres"
depends = ["pg-start"]
run = [
  "scripts/download-data.sh",
  "[ -f ci/tpch/sf0_01/tpch.sqlite ] || uv run -q bench/tpch_data.py 0.01",
]

[tasks.pg-start]
description = "Start the local test Postgres (socket in .pg/, port 54330)"
run = "scripts/pg.sh start"

[tasks.pg-stop]
description = "Stop the local test Postgres"
run = "scripts/pg.sh stop"

[tasks.build]
description = "Build the workspace"
run = "cargo build --workspace"

[tasks.test]
description = "Unit tests + conformance on all backends"
depends = ["setup"]
run = "cargo test --workspace --all-features"

[tasks.lint]
description = "rustfmt check + clippy"
run = ["cargo fmt --all --check", "cargo clippy --workspace --all-targets --all-features -- -D warnings"]

[tasks.conformance]
description = "Run ported Ibis cases on every backend: JSONL -> logs/conformance.jsonl, matrix -> stderr"
depends = ["setup"]
run = 'mkdir -p logs; f() { cargo run --quiet -p ibis-conformance -- "$@" > logs/conformance.jsonl 2> >(tee logs/conformance.txt >&2); }; f'

[tasks.goldens]
description = "Regenerate conformance/golden by running conformance/cases on Python Ibis (DuckDB; SQLite and Postgres for the cross-check)"
depends = ["setup"]
run = 'f() { uv run -q conformance/gen_goldens.py "$@"; }; f'

[tasks.dev]
description = "Rerun conformance on every change, tee to logs/dev.log"
run = 'mkdir -p logs; f() { watchexec -e rs,toml,py,json -r -- mise run conformance "$@" 2>&1 | tee logs/dev.log; }; f'

[tasks.bench]
description = "TPC-H sf=0.01: Python Ibis vs ibis-rs (release) -> logs/bench-*.jsonl, markdown report on stdout"
depends = ["setup"]
run = [
  "mkdir -p logs",
  "cargo build --quiet --release -p ibis-conformance --bin tpch-bench",
  "uv run -q bench/tpch_ibis.py --sf 0.01 > logs/bench-python.jsonl",
  "target/release/tpch-bench > logs/bench-rust.jsonl",
  "python3 bench/compare.py logs/bench-python.jsonl logs/bench-rust.jsonl | tee logs/bench.md",
]

[tasks.check-ids]
description = "Check every conformance case id is a real Ibis pytest id (collects Ibis's tests)"
run = "uv run -q conformance/check_ids.py"
