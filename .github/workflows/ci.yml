name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # no debug info: the DuckDB and Polars builds are large enough to fill the runner's disk
  CARGO_PROFILE_DEV_DEBUG: "0"
  # a backend whose container is down fails the run instead of being skipped
  IBIS_TESTING_STRICT: "1"
  # Every backend, with DuckDB linked from the prebuilt library the duckdb
  # crate downloads instead of compiled from source (13 minutes on a runner).
  # mise.toml's default is `--workspace --all-features`, which compiles it.
  IBIS_CARGO_FLAGS: >-
    --workspace --no-default-features --features
    ibis-rs/polars,ibis-rs/duckdb-linked,ibis-rs/sqlite,ibis-rs/postgres,ibis-rs/mysql,ibis-rs/clickhouse,ibis-rs/trino,ibis-rs/spark,ibis-rs/impala

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      # Several gigabytes of images: fetch them while the code is checked and
      # compiled. `mise run up` below waits for whatever is still coming.
      - run: nohup docker compose pull --quiet > "$RUNNER_TEMP/pull.log" 2>&1 &
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # rustc outputs cached one crate at a time. rust-cache above is keyed on
      # Cargo.lock, so without this a dependency change recompiles everything.
      - uses: mozilla-actions/sccache-action@v0.0.11
      - run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - uses: jdx/mise-action@v5
      - run: mise run lint
      - run: mise run unit
      # libduckdb.so, for binaries started outside cargo (the conformance
      # runner). The build script's own copy of it is the one a restored cache
      # still has; target/duckdb-download is only there after a download.
      - run: |
          lib=$(find "$PWD/target" -name libduckdb.so -print -quit)
          test -n "$lib"
          echo "LD_LIBRARY_PATH=$(dirname "$lib")" >> "$GITHUB_ENV"
      # every backend in compose.yaml, so none is skipped
      - run: mise run up
      # The conformance run is the gate: it exits non-zero on any case that
      # fails, as the `cargo test` gate of `mise run test` does, and the site
      # is built from its results. Running both would run the suite twice.
      - run: mise run site
      - run: ${SCCACHE_PATH} --show-stats
        if: always()
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push'
        with:
          path: site

  # Publish the parity site (coverage of the Ibis test suite) from main.
  pages:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
