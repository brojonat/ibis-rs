name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # no debug info: the DuckDB and Polars builds are large enough to fill the runner's disk
  CARGO_PROFILE_DEV_DEBUG: "0"
  # a backend whose container is down fails the run instead of being skipped
  IBIS_TESTING_STRICT: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # A cache restored for a different Cargo.lock keeps a pruned copy of the
      # unpacked DuckDB sources, and DuckDB's build script fails unpacking over
      # it ("Directory not empty").
      - run: rm -rf target/duckdb-sources
      - uses: jdx/mise-action@v5
      - run: mise run lint
      # every backend in compose.yaml, so none is skipped
      - run: mise run up
      - run: mise run test
      - run: mise run site
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push'
        with:
          path: site

  # Publish the parity site (coverage of the Ibis test suite) from main.
  pages:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
