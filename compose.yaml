# Backends the conformance suite runs against, one service per backend.
#   mise run up [service...]    start (all services if none named) and wait until healthy
#   mise run down               stop and delete their data
# Everything here is throwaway test data: ports bind to localhost only and
# there are no credentials worth protecting.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      # C locale: strings order bytewise, like DuckDB and the goldens
      POSTGRES_INITDB_ARGS: --no-locale -E UTF8
      POSTGRES_DB: ibis_testing
    ports: ["127.0.0.1:54330:5432"]
    volumes:
      - postgres:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # over TCP: the socket is up during init, before the server is ready for us
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "ibis_testing"]
      interval: 1s
      timeout: 5s
      retries: 60

  clickhouse:
    image: clickhouse/clickhouse-server:26.10
    environment:
      CLICKHOUSE_DB: ibis_testing
      CLICKHOUSE_USER: ibis
      CLICKHOUSE_PASSWORD: ibis
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports: ["127.0.0.1:18123:8123"]
    ulimits:
      nofile: 262144
    volumes:
      - clickhouse:/var/lib/clickhouse
    healthcheck:
      # by container address: during init the server only listens on localhost
      test: ["CMD-SHELL", "wget -qO- http://$$(hostname -i):8123/ping"]
      interval: 1s
      timeout: 5s
      retries: 60

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: ibis_testing
    # binary collation: strings compare and order bytewise, like DuckDB and the goldens
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_bin"]
    ports: ["127.0.0.1:13306:3306"]
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      # over TCP: during init the server only listens on its socket
      test: ["CMD", "mysqladmin", "ping", "--protocol=tcp", "-h", "127.0.0.1", "-u", "root"]
      interval: 1s
      timeout: 5s
      retries: 120

  trino:
    image: trinodb/trino:484
    ports: ["127.0.0.1:18080:8080"]
    volumes:
      # the image's own, with a fixed 2 GB heap in place of 80% of the host's memory
      - ./docker/trino/jvm.config:/etc/trino/jvm.config:ro
      - ./docker/trino/config.properties:/etc/trino/config.properties:ro
      - ./docker/trino/memory.properties:/etc/trino/catalog/memory.properties:ro
    healthcheck:
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      interval: 2s
      timeout: 10s
      retries: 90

volumes:
  postgres:
  clickhouse:
  mysql:
