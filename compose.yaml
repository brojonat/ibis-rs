# Backends the conformance suite runs against, one service per backend.
#   mise run up [service...]    start (all services if none named) and wait until healthy
#   mise run down               stop and delete their data
# Everything here is throwaway test data: ports bind to localhost only and
# there are no credentials worth protecting.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      # C collation: strings order bytewise, like DuckDB and the goldens.
      # A UTF-8 character type: UPPER and LOWER know letters beyond ASCII.
      POSTGRES_INITDB_ARGS: --lc-collate=C --lc-ctype=C.UTF-8 -E UTF8
      POSTGRES_DB: ibis_testing
    ports: ["127.0.0.1:54330:5432"]
    volumes:
      - postgres:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # over TCP: the socket is up during init, before the server is ready for us
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "ibis_testing"]
      interval: 1s
      timeout: 5s
      retries: 60

  clickhouse:
    image: clickhouse/clickhouse-server:26.10
    environment:
      CLICKHOUSE_DB: ibis_testing
      CLICKHOUSE_USER: ibis
      CLICKHOUSE_PASSWORD: ibis
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports: ["127.0.0.1:18123:8123"]
    ulimits:
      nofile: 262144
    volumes:
      - clickhouse:/var/lib/clickhouse
    healthcheck:
      # by container address: during init the server only listens on localhost
      test: ["CMD-SHELL", "wget -qO- http://$$(hostname -i):8123/ping"]
      interval: 1s
      timeout: 5s
      retries: 60

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: ibis_testing
    # binary collation: strings compare and order bytewise, like DuckDB and the goldens
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_bin"]
    ports: ["127.0.0.1:13306:3306"]
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      # over TCP: during init the server only listens on its socket
      test: ["CMD", "mysqladmin", "ping", "--protocol=tcp", "-h", "127.0.0.1", "-u", "root"]
      interval: 1s
      timeout: 5s
      retries: 120

  trino:
    image: trinodb/trino:484
    ports: ["127.0.0.1:18080:8080"]
    volumes:
      # the image's own, with a fixed 2 GB heap in place of 80% of the host's memory
      - ./docker/trino/jvm.config:/etc/trino/jvm.config:ro
      - ./docker/trino/config.properties:/etc/trino/config.properties:ro
      - ./docker/trino/memory.properties:/etc/trino/catalog/memory.properties:ro
    healthcheck:
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      interval: 2s
      timeout: 10s
      retries: 90

  # Spark SQL behind its Thrift server (the HiveServer2 protocol), one local
  # JVM. Tables live in the container: recreating it empties them.
  spark:
    image: apache/spark:4.3.0-scala
    command:
      - /opt/spark/bin/spark-submit
      - --class
      - org.apache.spark.sql.hive.thriftserver.HiveThriftServer2
      - --name
      - ibis_testing
      - --master
      - local[4]
      - --driver-memory
      - 1500m
      # generated classes are unloaded once this much is in use, not kept forever
      - --driver-java-options
      - -XX:MaxMetaspaceSize=384m
      - --conf
      - spark.ui.enabled=false
      # What the server remembers of finished statements, with their plans.
      # An INSERT's plan holds its rows, and the defaults keep a thousand.
      - --conf
      - spark.sql.ui.retainedExecutions=20
      - --conf
      - spark.ui.retainedJobs=50
      - --conf
      - spark.ui.retainedStages=50
      - --conf
      - spark.sql.thriftServer.ui.retainedStatements=20
      - --conf
      - spark.sql.thriftServer.ui.retainedSessions=20
      - --conf
      - spark.sql.session.timeZone=UTC
      # 200 by default: far too many for tables this small
      - --conf
      - spark.sql.shuffle.partitions=4
      - spark-internal
    environment:
      # glibc otherwise gives each of the JVM's many threads its own malloc arena
      MALLOC_ARENA_MAX: "2"
    ports: ["127.0.0.1:20000:10000"]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/10000"]
      interval: 2s
      timeout: 10s
      retries: 90

  # Impala is four processes: the Hive metastore (table definitions), the
  # statestore (membership), the catalog (the metastore's cache) and one
  # daemon that plans and runs queries. `mise run up impala` starts all four.
  # They get a network of their own: the metastore client looks its server up
  # by address and gets back `<container>.<network>`, and the default network's
  # name has an underscore, which a URI's host may not.
  impala-metastore:
    image: apache/impala:4.5.3-impala_quickstart_hms
    command: hms
    networks: [impala]
    volumes:
      # The metastore's files and the warehouse (hive-site.xml puts it here).
      # /var/lib/hive exists in this image and belongs to the user the
      # services run as; a new volume takes that ownership from it, which is
      # why the other two mount it at the same path, after this one.
      - impala:/var/lib/hive
      - ./docker/impala:/opt/hive/conf:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9083"]
      interval: 2s
      timeout: 10s
      retries: 90

  impala-statestore:
    image: apache/impala:4.5.3-statestored
    command: ["-redirect_stdout_stderr=false", "-logtostderr", "-v=1"]
    networks: [impala]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/25010"]
      interval: 2s
      timeout: 10s
      retries: 90

  impala-catalog:
    image: apache/impala:4.5.3-catalogd
    depends_on:
      impala-metastore: { condition: service_healthy }
      impala-statestore: { condition: service_healthy }
    networks: [impala]
    command:
      - -redirect_stdout_stderr=false
      - -logtostderr
      - -v=1
      - -state_store_host=impala-statestore
      - -hms_event_polling_interval_s=1
    environment:
      JAVA_TOOL_OPTIONS: -Xmx1g
    volumes:
      - impala:/var/lib/hive
      - ./docker/impala:/opt/impala/conf:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/25020"]
      interval: 2s
      timeout: 10s
      retries: 90

  impala:
    image: apache/impala:4.5.3-impalad_coord_exec
    depends_on:
      impala-catalog: { condition: service_healthy }
    networks: [impala]
    command:
      - -redirect_stdout_stderr=false
      - -logtostderr
      - -v=1
      - -state_store_host=impala-statestore
      - -catalog_service_host=impala-catalog
      - -mem_limit=4gb
      - -default_query_options=default_file_format=parquet
    environment:
      # the JVM only plans queries, and its heap counts toward -mem_limit
      JAVA_TOOL_OPTIONS: -Xmx1g
    ports: ["127.0.0.1:21050:21050"]
    volumes:
      - impala:/var/lib/hive
      - ./docker/impala:/opt/impala/conf:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/21050"]
      interval: 2s
      timeout: 10s
      retries: 90

volumes:
  postgres:
  clickhouse:
  mysql:
  impala:

networks:
  impala:
    name: ibis-impala
