[package]
name = "ibis-conformance"
description = "Runs ported Ibis backend tests against every ibis-rs backend"
version.workspace = true
edition.workspace = true
license = "Apache-2.0" # adapted from Ibis tests; see NOTICE
publish = false
default-run = "ibis-conformance"

[features]
default = ["bundled-duckdb"]
# DuckDB compiled from source. CI builds without it and links the prebuilt library.
bundled-duckdb = ["ibis-duckdb/bundled"]

[dependencies]
ibis-core.workspace = true
ibis-duckdb.workspace = true
ibis-sqlite.workspace = true
ibis-postgres.workspace = true
ibis-polars.workspace = true
ibis-clickhouse.workspace = true
ibis-mysql.workspace = true
ibis-trino.workspace = true
arrow-array.workspace = true
parquet.workspace = true
serde_json.workspace = true
