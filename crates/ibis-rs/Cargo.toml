[package]
name = "ibis-rs"
description = "Portable lazy dataframe API for Rust, modeled on Python Ibis: write a query once, run it on Polars, DuckDB, SQLite or Postgres"
# ahead of the workspace version: 0.1.1 added the polars feature and made it the default
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

# One feature per backend. Polars is the default: in process, no server, no C++ build.
[features]
default = ["polars"]
polars = ["dep:ibis-polars"]
duckdb = ["dep:ibis-duckdb"]
sqlite = ["dep:ibis-sqlite"]
postgres = ["dep:ibis-postgres"]
clickhouse = ["dep:ibis-clickhouse"]

[dependencies]
ibis-core.workspace = true
ibis-sql.workspace = true
ibis-polars = { workspace = true, optional = true }
ibis-duckdb = { workspace = true, optional = true }
ibis-sqlite = { workspace = true, optional = true }
ibis-postgres = { workspace = true, optional = true }
ibis-clickhouse = { workspace = true, optional = true }
arrow-array.workspace = true

# docs.rs cannot build bundled DuckDB within its limits; document the rest.
[package.metadata.docs.rs]
features = ["polars", "sqlite", "postgres", "clickhouse"]
