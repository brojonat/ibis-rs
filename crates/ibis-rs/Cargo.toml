[package]
name = "ibis-rs"
description = "Portable lazy dataframe API for Rust, modeled on Python Ibis: write a query once, run it on Polars, DuckDB, SQLite, Postgres, MySQL, ClickHouse or Trino"
# ahead of the workspace version: 0.1.1 added the polars feature and made it
# the default, 0.1.2 the clickhouse feature
version = "0.1.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

# One feature per backend. Polars is the default: in process, no server, no C++ build.
[features]
default = ["polars"]
polars = ["dep:ibis-polars"]
# DuckDB compiled from source and linked statically: nothing to install, slow first build.
duckdb = ["duckdb-linked", "ibis-duckdb/bundled"]
# DuckDB linked from a prebuilt shared library (downloaded at build time, or
# DUCKDB_LIB_DIR): builds in seconds, and libduckdb must be found at run time.
duckdb-linked = ["dep:ibis-duckdb"]
sqlite = ["dep:ibis-sqlite"]
postgres = ["dep:ibis-postgres"]
clickhouse = ["dep:ibis-clickhouse"]
mysql = ["dep:ibis-mysql"]
trino = ["dep:ibis-trino"]

[dependencies]
ibis-core.workspace = true
ibis-sql.workspace = true
ibis-polars = { workspace = true, optional = true }
ibis-duckdb = { workspace = true, optional = true }
ibis-sqlite = { workspace = true, optional = true }
ibis-postgres = { workspace = true, optional = true }
ibis-clickhouse = { workspace = true, optional = true }
ibis-mysql = { workspace = true, optional = true }
ibis-trino = { workspace = true, optional = true }
arrow-array.workspace = true

# docs.rs cannot build bundled DuckDB within its limits; document the rest.
[package.metadata.docs.rs]
features = ["polars", "sqlite", "postgres", "mysql", "clickhouse", "trino"]
