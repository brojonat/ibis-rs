[package]
name = "ibis-rs"
description = "Portable lazy dataframe API for Rust, modeled on Python Ibis: write a query once, run it on DuckDB, SQLite or Postgres"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

# One feature per backend. None is on by default yet: pick the engines you use.
[features]
default = []
duckdb = ["dep:ibis-duckdb"]
sqlite = ["dep:ibis-sqlite"]
postgres = ["dep:ibis-postgres"]

[dependencies]
ibis-core.workspace = true
ibis-sql.workspace = true
ibis-duckdb = { workspace = true, optional = true }
ibis-sqlite = { workspace = true, optional = true }
ibis-postgres = { workspace = true, optional = true }
arrow-array.workspace = true

# docs.rs cannot build bundled DuckDB within its limits; document the rest.
[package.metadata.docs.rs]
features = ["sqlite", "postgres"]
