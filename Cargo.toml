[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes/unparser"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/brojonat/ibis-rs"
readme = "README.md"
keywords = ["dataframe", "sql", "ibis", "database", "query"]
categories = ["database"]

[workspace.dependencies]
# One arrow version for the whole workspace. Backends whose driver links a
# different arrow must convert via the Arrow C Data Interface (see LEARNINGS.md).
arrow-array = "60.1"
arrow-schema = "60.1"
parquet = { version = "60.1", default-features = false, features = ["arrow", "snap", "zstd"] }
# `bundled` (compile DuckDB from source) is ibis-duckdb's default feature, not set here
duckdb = { version = "1.20000.1", features = ["appender-arrow"] }
rusqlite = { version = "0.42", features = ["bundled", "functions"] }
regex = "1"
postgres = { version = "0.19", features = ["with-chrono-0_4"] }
# Polars brings its own Arrow implementation (polars-arrow), separate from arrow-rs.
polars = { version = "0.55.2", default-features = false, features = [
  "lazy", "fmt", "timezones", "dtype-date", "dtype-datetime", "dtype-i8", "dtype-i16", "dtype-u8", "dtype-u16", "dtype-decimal",
  "strings", "regex", "temporal", "round_series", "rank", "cum_agg", "is_in", "abs", "sign", "log", "trigonometry",
  "semi_anti_join", "cross_join", "concat_str", "string_pad", "string_reverse", "coalesce", "range", "dtype-array", "dtype-struct", "string_encoding", "string_to_integer", "dtype-u128", "dtype-i128",
] }
thiserror = "2"
serde_json = "1"
chrono = "0.4"
ureq = "3.5"
# text protocol only: no TLS, no derive macros
mysql = { version = "28", default-features = false, features = ["minimal-rust"] }

ibis-core = { path = "crates/ibis-core", version = "0.1.0" }
ibis-sql = { path = "crates/ibis-sql", version = "0.1.2" }
ibis-duckdb = { path = "crates/ibis-duckdb", version = "0.1.1", default-features = false }
ibis-sqlite = { path = "crates/ibis-sqlite", version = "0.1.0" }
ibis-postgres = { path = "crates/ibis-postgres", version = "0.1.0" }
ibis-clickhouse = { path = "crates/ibis-clickhouse", version = "0.1.0" }
ibis-polars = { path = "crates/ibis-polars", version = "0.1.0" }
ibis-mysql = { path = "crates/ibis-mysql", version = "0.1.0" }
ibis-trino = { path = "crates/ibis-trino", version = "0.1.0" }
ibis-hiveserver2 = { path = "crates/ibis-hiveserver2", version = "0.1.0" }
ibis-spark = { path = "crates/ibis-spark", version = "0.1.0" }
ibis-impala = { path = "crates/ibis-impala", version = "0.1.0" }

# Line numbers in backtraces and nothing more: full debug info for Polars,
# DuckDB and arrow in every test binary grew target/ past 180 GB.
[profile.dev]
debug = "line-tables-only"

# Optimize dependencies (DuckDB, SQLite, regex, parquet) even in dev builds;
# our own crates stay fast to compile. Debug-built DuckDB/SQLite are very slow.
[profile.dev.package."*"]
opt-level = 2
debug = false
